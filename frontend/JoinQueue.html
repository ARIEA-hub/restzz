<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Sense | Live Waitlist</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }
        body { background-color: #f4f7f9; display: flex; flex-direction: column; align-items: stretch; min-height: 100vh; padding: 0; }

        .navbar { min-height: 70px; padding: 14px 40px; background: #fff; border-bottom: 1px solid #e1e8ed; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2000; }
        .navbar .logo { display: flex; align-items: center; gap: 8px; color: #3178c6; font-size: 1.5rem; font-weight: 800; white-space: nowrap; }
        .navbar .nav-links { display: flex; align-items: center; gap: 24px; }
        .navbar .nav-links a { color: #555; text-decoration: none; font-weight: 600; }
        .navbar .nav-links a:hover, .navbar .nav-links a.active { color: #3178c6; }
        .profile-menu { position: relative; }
        .profile-toggle { display: inline-flex; align-items: center; gap: 10px; min-height: 42px; padding: 7px 14px 7px 8px; border: 1px solid #dfeaf5; border-radius: 999px; background: #fff; color: #1a1a1a; font: inherit; font-weight: 600; cursor: pointer; }
        .profile-toggle:hover, .profile-toggle:focus-visible { border-color: #3178c6; outline: none; }
        #navUserInitial { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; border-radius: 50%; background: #3178c6; color: #fff; font-size: 0.8rem; }
        .caret { color: #666; font-size: 0.8rem; }
        .profile-dropdown { position: absolute; top: calc(100% + 8px); right: 0; display: flex; min-width: 190px; flex-direction: column; overflow: hidden; background: #fff; border: 1px solid #e7edf3; border-radius: 12px; box-shadow: 0 15px 30px rgba(0,0,0,.12); }
        .profile-dropdown.hidden { display: none; }
        .profile-dropdown a { padding: 12px 14px; color: #333; text-decoration: none; border-bottom: 1px solid #eef3f8; }
        .profile-dropdown a:hover { background: #f4f8fc; }
        .profile-dropdown a:last-child { color: #d9534f; border-bottom: 0; }
        .queue-card { margin: 40px auto; }

        @media (max-width: 760px) {
            .navbar { flex-wrap: wrap; gap: 12px; padding: 12px 18px; }
            .navbar .nav-links { order: 3; width: 100%; justify-content: center; gap: 14px; overflow-x: auto; }
        }
        
        .queue-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h2 { color: #3178c6; margin-bottom: 10px; font-size: 1.8rem; }
        p.subtitle { color: #666; margin-bottom: 30px; }

        #join-section { display: block; }
        .input-group { margin-bottom: 25px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        .input-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
        
        .join-btn { width: 100%; background: #3178c6; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .join-btn:hover { background: #255a96; }
        .join-btn:disabled { opacity: .6; }
        .leave-btn { width: 100%; margin-top: 12px; padding: 11px 15px; border: 1px solid #d9534f; border-radius: 8px; background: #fff; color: #d9534f; font: inherit; font-weight: 600; cursor: pointer; transition: background 0.2s, color 0.2s; }
        .leave-btn:hover { background: #d9534f; color: #fff; }

   
        #tracker-section { display: none; }
        .ticket {
            background: #f8fbff;
            border: 2px dashed #3178c6;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
            position: relative;
        }
        .position-label { color: #555; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; }
        .position-number { font-size: 5rem; color: #3178c6; font-weight: 700; line-height: 1; margin: 10px 0; }
        
        .status-badge {
            display: inline-block;
            background: #eef5fb;
            color: #3178c6;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 10px;
        }
        .status-badge.called { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }

        .wait-time { font-size: 1.2rem; color: #333; font-weight: 600; margin-bottom: 5px; }
        .people-ahead { color: #888; font-size: 0.9rem; }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3178c6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Tic-tac-toe while waiting */
        #ttt-container { margin-top: 28px; padding-top: 22px; border-top: 1px solid #e1e8ed; text-align: left; }
        .ttt-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; color: #333; }
        .ttt-levels { display: inline-flex; border: 1px solid #dfeaf5; border-radius: 999px; overflow: hidden; }
        .ttt-levels button { padding: 5px 12px; border: 0; background: #fff; color: #555; font: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        .ttt-levels button[aria-pressed="true"] { background: #3178c6; color: #fff; }
        .ttt-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(100%, 240px); margin: 0 auto; }
        .ttt-cell { aspect-ratio: 1; border: 2px solid #dfeaf5; border-radius: 10px; background: #f8fbff; color: #3178c6; font-size: 2rem; font-weight: 700; cursor: pointer; }
        .ttt-cell:disabled { cursor: default; color: #1a1a1a; }
        .ttt-cell:not(:disabled):hover { border-color: #3178c6; }
        .ttt-cell.ttt-win { background: #eef5fb; border-color: #3178c6; }
        .ttt-status { margin-top: 12px; text-align: center; font-weight: 600; color: #333; }
        .ttt-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 0.85rem; color: #555; }
        .ttt-foot button { padding: 6px 12px; border: 1px solid #3178c6; border-radius: 6px; background: #fff; color: #3178c6; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">🍴 Q-Sense</a>
        <nav class="nav-links">
            <a href="CustomerHome.html">Home</a>
            <a href="CustomerDashboard.html">Dashboard</a>
            <a href="locations.html">Locations</a>
            <a href="CustomerReservation.html">Reservation</a>
        </nav>
        <div class="profile-menu">
            <button id="profileToggle" class="profile-toggle" type="button" aria-expanded="false">
                <span id="navUserInitial">U</span>
                <span id="navUserName">Profile</span>
                <span class="caret">▾</span>
            </button>
            <div id="profileDropdown" class="profile-dropdown hidden">
                <a href="CustomerDashboard.html">My Profile</a>
                <a href="CustomerReservation.html">My Reservations</a>
                <a href="CustomerLogin.html" id="logoutCustomer">Logout</a>
            </div>
        </div>
    </header>

    <div class="queue-card">
        <h2>Live Waitlist</h2>
        <p class="subtitle" id="restaurant-display">Loading restaurant…</p>

        <div id="join-section">
            <form id="join-form">
                <div class="input-group">
                    <label for="group-size">How many people in your party?</label>
                    <select id="group-size" required>
                        <option value="1">1 person</option>
                        <option value="2" selected>2 people</option>
                        <option value="3">3 people</option>
                        <option value="4">4 people</option>
                        <option value="5">5 people</option>
                        <option value="6">6 people</option>
                        <option value="7">7 people</option>
                        <option value="8">8 people</option>
                    </select>
                    <p class="muted" style="margin-top:6px;">More than 8? Please call the restaurant.</p>
                </div>
                <button type="submit" class="join-btn">Join the waitlist</button>
            </form>
        </div>

        <div id="tracker-section">
            <div class="ticket">
                <div class="position-label">Your position</div>
                <div class="position-number" id="display-position">--</div>
                <div class="status-badge" id="display-status">Waiting</div>
            </div>

            <div class="wait-time"><span class="loader"></span> Estimated wait: <span id="display-ewt">--</span> min</div>
            <div class="people-ahead" id="display-ahead"></div>
            <button id="leave-queue-btn" class="leave-btn" type="button">Leave the queue</button>
            <div id="ttt-container"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/tictactoe.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const restaurantId = urlParams.get('restaurant_id');
        const customerId = localStorage.getItem('customer_id');
        let pollingInterval;

        const queueMap = () => JSON.parse(localStorage.getItem('active_queue_map') || '{}');
        function rememberQueue(queueId) {
            const map = queueMap();
            map[restaurantId] = queueId;
            localStorage.setItem('active_queue_map', JSON.stringify(map));
            localStorage.setItem('current_queue_id', queueId);
        }
        function forgetQueue() {
            clearInterval(pollingInterval);
            const map = queueMap();
            delete map[restaurantId];
            localStorage.setItem('active_queue_map', JSON.stringify(map));
            localStorage.removeItem('current_queue_id');
        }

        window.addEventListener('DOMContentLoaded', async () => {
            if (!customerId || !localStorage.getItem('auth_token')) {
                window.location.href = 'CustomerLogin.html';
                return;
            }
            const display = document.getElementById('restaurant-display');
            if (!restaurantId) {
                display.textContent = 'Choose a restaurant from the Locations page first.';
                document.getElementById('join-section').style.display = 'none';
                return;
            }

            try {
                const restaurant = await apiFetch(`/restaurant/${encodeURIComponent(restaurantId)}`);
                display.textContent = restaurant.name;
            } catch (error) {
                display.textContent = 'Restaurant not found.';
                document.getElementById('join-section').style.display = 'none';
                return;
            }

            const savedQueueId = queueMap()[restaurantId];
            if (savedQueueId) switchToTracker(savedQueueId);
        });

        document.getElementById('join-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const button = e.submitter || e.target.querySelector('button[type="submit"]');
            button.disabled = true;
            try {
                const data = await customerFetch('/queue/join', {
                    method: 'POST',
                    body: JSON.stringify({ restaurant_id: restaurantId, group_size: Number(document.getElementById('group-size').value) })
                });
                rememberQueue(data.queue_id);
                switchToTracker(data.queue_id);
            } catch (error) {
                // Already in this queue: pick up the existing ticket.
                if (error.status === 409 && error.data && error.data.queue_id) {
                    rememberQueue(error.data.queue_id);
                    switchToTracker(error.data.queue_id);
                } else {
                    toast(error.message, 'error');
                }
            } finally {
                button.disabled = false;
            }
        });

        function switchToTracker(queueId) {
            document.getElementById('join-section').style.display = 'none';
            document.getElementById('tracker-section').style.display = 'block';
            document.getElementById('leave-queue-btn').hidden = false;
            document.querySelector('.wait-time .loader').hidden = false;
            if (!document.querySelector('#ttt-container .ttt')) {
                TicTacToe.mount(document.getElementById('ttt-container'));
            }
            clearInterval(pollingInterval);
            fetchQueueStatus(queueId);
            pollingInterval = setInterval(() => fetchQueueStatus(queueId), 5000);
        }

        function showJoinForm() {
            document.getElementById('tracker-section').style.display = 'none';
            document.getElementById('join-section').style.display = 'block';
        }

        async function leaveQueue(queueId) {
            const leaveButton = document.getElementById('leave-queue-btn');
            leaveButton.disabled = true;
            try {
                await customerFetch(`/queue/leave/${queueId}`, { method: 'PATCH' });
                forgetQueue();
                showJoinForm();
                toast('You have left the queue.');
            } catch (error) {
                toast(error.message, 'error');
            } finally {
                leaveButton.disabled = false;
            }
        }

        document.getElementById('leave-queue-btn').addEventListener('click', () => {
            const queueId = localStorage.getItem('current_queue_id') || queueMap()[restaurantId];
            if (queueId && confirm('Leave the queue? You will lose your place.')) leaveQueue(queueId);
        });

        // The ticket is finished: stop polling and show the outcome.
        function finish(label, symbol) {
            forgetQueue();
            document.getElementById('display-status').textContent = label;
            document.getElementById('display-status').className = 'status-badge';
            document.getElementById('display-position').textContent = symbol;
            document.getElementById('display-ahead').textContent = '';
            document.getElementById('display-ewt').textContent = '0';
            document.querySelector('.wait-time .loader').hidden = true;
            document.getElementById('leave-queue-btn').hidden = true;
        }

        async function fetchQueueStatus(queueId) {
            try {
                const data = await customerFetch(`/queue/status/${queueId}`);
                const badge = document.getElementById('display-status');

                if (data.status === 'waiting' || data.status === 'called') {
                    document.getElementById('display-position').textContent = data.position;
                    const ewt = document.getElementById('display-ewt');
                    ewt.textContent = data.estimated_wait_time;
                    ewt.title = data.estimate_source === 'decision_tree'
                        ? 'Predicted from the queue, free tables and time of day'
                        : 'Rough estimate: about 5 minutes per party ahead';
                    document.getElementById('display-ahead').textContent =
                        data.people_ahead === 0 ? "You're next." : `${data.people_ahead} ${data.people_ahead === 1 ? 'party' : 'parties'} ahead of you`;
                    if (data.status === 'called') {
                        badge.textContent = "You're being called. Please go to the host stand.";
                        badge.className = 'status-badge called';
                    } else {
                        badge.textContent = 'Waiting';
                        badge.className = 'status-badge';
                    }
                } else if (data.status === 'seated') {
                    finish('Your table is ready. Enjoy your meal.', '✓');
                } else if (data.status === 'left') {
                    finish('You are no longer in this queue.', '–');
                }
            } catch (error) {
                // The ticket no longer exists (e.g. cleared by staff): start over.
                if (error.status === 404) {
                    forgetQueue();
                    showJoinForm();
                } else {
                    console.error('Polling error:', error);
                }
            }
        }
    </script>
    <script>
        const profileToggle = document.getElementById('profileToggle');
        const profileDropdown = document.getElementById('profileDropdown');
        const logoutCustomer = document.getElementById('logoutCustomer');

        profileToggle.addEventListener('click', (event) => {
            event.stopPropagation();
            const isHidden = profileDropdown.classList.toggle('hidden');
            profileToggle.setAttribute('aria-expanded', String(!isHidden));
        });

        document.addEventListener('click', (event) => {
            if (!event.target.closest('.profile-menu')) {
                profileDropdown.classList.add('hidden');
                profileToggle.setAttribute('aria-expanded', 'false');
            }
        });

        logoutCustomer.addEventListener('click', () => {
            localStorage.clear();
        });
    </script>
    <script src="js/navigation.js"></script>
</body>
</html>
